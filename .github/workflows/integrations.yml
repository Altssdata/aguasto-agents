name: Public integrations
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m pip install build twine
      - run: python3 -m build python --outdir dist
      - run: python3 -m twine check --strict dist/*
      - run: python3 -m pip install --no-deps dist/*.whl
      - run: aguasto-research fixtures
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: node javascript/cli.mjs fixtures
      - run: PYTHONPATH=python python3 -m aguasto_research fixtures
      - name: Go SDK unit and live API tests
        working-directory: go
        env:
          AGUASTO_LIVE_TEST: "1"
        run: |
          go test ./...
          go vet ./...
          go run ./cmd/aguasto-research fixtures
  homebrew:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: ruby -c Formula/aguasto-research.rb
      - run: |
          brew tap altssdata/aguasto-agents https://github.com/Altssdata/aguasto-agents
          mkdir -p "$(brew --repo altssdata/aguasto-agents)/Formula"
          cp Formula/aguasto-research.rb "$(brew --repo altssdata/aguasto-agents)/Formula/aguasto-research.rb"
          brew install altssdata/aguasto-agents/aguasto-research
      - run: brew test altssdata/aguasto-agents/aguasto-research
      - run: aguasto-research --help
