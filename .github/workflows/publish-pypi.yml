name: Publish Python SDK to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: python/v1.0.1
          persist-credentials: false
      - name: Validate the release source
        run: |
          test "$(git describe --tags --exact-match)" = "python/v1.0.1"
          PYTHONPATH=python python3 -m aguasto_research fixtures
      - name: Build and validate distributions
        run: |
          python3 -m pip install build twine
          python3 -m build python --outdir dist
          python3 -m twine check --strict dist/*
          python3 -m pip install --no-deps dist/*.whl
          aguasto-research fixtures
          python3 -c "import importlib.metadata as m; assert m.version('aguasto-research') == '1.0.1'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aguasto-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: aguasto-python-distributions
          path: dist
      - name: Publish through the configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
